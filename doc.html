# Train an LLM From Scratch: The 0 to 100 Curriculum

The syllabus you would hand a strong grad student who wants to go from zero to building and understanding a full LLM training stack. It is organized as a progression. Each module has the *why*, the canonical papers, hands-on resources, and the **lexicon** (the words researchers actually use in Slack and in paper reviews). Read in order, but the lexicon sections you can skim ahead for vocabulary.

---

## Module 0: Orientation and Mental Model

Before any math, internalize the pipeline. Every LLM is: **tokenize, pretrain (next-token prediction), mid-train, post-train (SFT + RLHF/RLVR), align, evaluate, serve**. Everything else is detail hanging off this skeleton.

**Do this first (single best 0-100 hands-on artifact):**
- **Karpathy's [nanochat](https://github.com/karpathy/nanochat)**: 8K lines, the entire stack (tokenizer, pretrain, SFT, RL, eval, web UI) for about $100 on an 8xH100 node. This is *the* reference implementation to read end to end. Clone it, read every file, run the speedrun.
- Karpathy's **[Neural Networks: Zero to Hero](https://karpathy.ai/zero-to-hero.html)** YouTube series, especially "Let's build GPT" and "Let's build the GPT Tokenizer." Watch with the code open.
- **[nanollama](https://github.com/karpathy/nanochat/discussions/557)**: 2026 spinoff, raw text to Llama 3 to GGUF in one command. Good for seeing a modern Llama-style stack.

**Lexicon:** autoregressive, causal LM, next-token prediction, teacher forcing, cross-entropy loss, perplexity (ppl = exp(loss)), bits-per-byte (BPB), token, context length, base model vs instruct model, foundation model, pretraining vs post-training.

---

## Module 1: Tokenization (the part everyone underrates)

Tokenization silently determines your model's math ability, multilingual fairness, and effective context. "Normal people" skip this. Do not.

**Read/watch:**
- Karpathy, "Let's build the GPT Tokenizer" (video plus the `minbpe` repo).
- Sennrich et al., BPE for NMT (2016), the original subword idea: [arxiv 1508.07909](https://arxiv.org/abs/1508.07909).
- SentencePiece (Kudo and Richardson, 2018): [arxiv 1808.06226](https://arxiv.org/abs/1808.06226), and the Unigram LM tokenizer (Kudo 2018) which is *different* from BPE and used by T5/Gemma.
- HuggingFace [tokenizers](https://github.com/huggingface/tokenizers) library docs.

**Tit-bits that bite people:**
- **Byte-level BPE (BBPE)** vs char-level: modern models work over UTF-8 bytes so nothing is ever OOV.
- **Pretokenization regex** controls whether numbers, contractions, and whitespace merge sanely. Get this wrong and arithmetic dies.
- **Digit tokenization**: left-to-right vs right-to-left grouping massively affects arithmetic. Llama 3 splits digits individually.
- **Glitch tokens** (SolidGoldMagikarp): tokens in vocab but almost never in training data cause bizarre behavior.
- **Fertility** (tokens per word): high fertility on a language means it is taxed on context and cost.
- **Vocabulary size tradeoff**: bigger vocab means shorter sequences but fatter embedding/softmax matrices and rarer tokens undertrained.

**Lexicon:** subword, merge rules, vocab, BPE/BBPE, WordPiece, Unigram LM, SentencePiece, pretokenizer, fertility, OOV, special tokens, chat template, tokenizer-free / byte-latent (BLT).

---

## Module 2: The Transformer, Modern Edition

The 2017 vanilla Transformer is *not* what people train now. Learn the modern stack directly.

**Foundational:**
- Vaswani et al., "Attention Is All You Need" (2017): [arxiv 1706.03762](https://arxiv.org/abs/1706.03762).
- The Illustrated Transformer (Jay Alammar) and The Annotated Transformer (Harvard).
- Jun Yu Tan, ["The Crystallization of Transformer Architectures (2017-2025)"](https://jytan.net/blog/2025/transformer-architectures/).

**The modern default stack (memorize these five):**
1. **Pre-norm + RMSNorm**: Zhang and Sennrich (2019): [arxiv 1910.07467](https://arxiv.org/abs/1910.07467).
2. **RoPE**: Su et al.: [arxiv 2104.09864](https://arxiv.org/abs/2104.09864). Enables NTK-aware / YaRN context extension ([YaRN](https://arxiv.org/abs/2309.00071)).
3. **SwiGLU**: Shazeer: [arxiv 2002.05202](https://arxiv.org/abs/2002.05202). Note the 2/3 hidden-dim trick.
4. **GQA**: Ainslie et al.: [arxiv 2305.13245](https://arxiv.org/abs/2305.13245), generalizing MQA. A KV-cache memory play.
5. **Bias-free linear layers plus tied or untied embeddings**.

**Attention efficiency:**
- **FlashAttention** (Dao et al. 2022): [arxiv 2205.14135](https://arxiv.org/abs/2205.14135), plus v2 and v3. IO-awareness: it is about HBM to SRAM traffic, not FLOPs.
- KV cache, PagedAttention (vLLM), sliding-window attention (Mistral), attention sinks / StreamingLLM.

**Lexicon:** pre-norm/post-norm, residual stream, Q/K/V, causal mask, RoPE, ALiBi, NoPE, YaRN, KV cache, MHA/MQA/GQA/MLA, IO-aware, SRAM/HBM, tied embeddings, logit, QK-norm, logit soft-capping.

---

## Module 3: Training Dynamics, Optimization and Init

Where models go to die (loss spikes) and how people keep them alive.

**Read:**
- AdamW (Loshchilov and Hutter): [arxiv 1711.05101](https://arxiv.org/abs/1711.05101), decoupled weight decay, still the default.
- muP / muTransfer (Yang et al., "Tensor Programs V"): [arxiv 2203.03466](https://arxiv.org/abs/2203.03466). Tune hyperparameters on a tiny model, transfer to the big one. A genuine tit-bit normal people miss.
- Cosine LR schedule plus linear warmup, and why WSD (Warmup-Stable-Decay) schedules are eating cosine's lunch.
- Gradient clipping, z-loss, loss spikes and mitigation.
- Newer optimizers: Lion, Sophia, Adam-mini, Muon, Shampoo/SOAP.
- Mixed precision: bf16 vs fp16 (bf16 won), fp8 training, loss scaling, master weights.

**Tit-bits:** critical batch size (McCandlish et al.); warmup length matters more than people think; weight decay interacts with the LR schedule; QK-norm and z-loss are cheap insurance against spikes.

**Lexicon:** AdamW, weight decay, warmup, cosine/WSD schedule, LR annealing, gradient clipping, grad norm, loss spike, z-loss, muP/muTransfer, coordinate check, critical batch size, gradient accumulation, bf16/fp8, loss scaling, optimizer states.

---

## Module 4: Scaling Laws and Compute-Optimality

This is the intellectual core. It is how labs *decide* how big a model to train and on how much data.

**Read in this order:**
- Kaplan et al., "Scaling Laws for Neural Language Models" (2020): [arxiv 2001.08361](https://arxiv.org/abs/2001.08361).
- Hoffmann et al., Chinchilla (2022): [arxiv 2203.15556](https://arxiv.org/abs/2203.15556), the about 20 tokens/param rule. [Explainer](https://lifearchitect.ai/chinchilla/).
- "Beyond Chinchilla-Optimal": folds inference cost into the objective. Why deployed models are over-trained.
- **C is about 6ND**: memorize this. Compute is about 6 x params x tokens.
- Muennighoff et al., "Scaling Data-Constrained Language Models": [arxiv 2305.16264](https://arxiv.org/abs/2305.16264).

**Tit-bits:** the Kaplan-vs-Chinchilla discrepancy was partly a warmup/LR-schedule artifact. Also isoFLOP curves, the irreducible loss term, and emergence vs smooth scaling.

**Lexicon:** power law, compute-optimal, isoFLOP, 6ND, tokens-per-parameter, over-training, irreducible loss, scaling exponent, emergent abilities, grokking, double descent, inference-adjusted scaling.

---

## Module 5: Data: Curation, Dedup, Mixtures (the real moat)

Frontier quality is 80% data. The least-glamorous and most-important module.

**Read:**
- The Pile, RefinedWeb ([arxiv 2306.01116](https://arxiv.org/abs/2306.01116)), Dolma, FineWeb and FineWeb-Edu ([FineWeb blog](https://huggingface.co/spaces/HuggingFaceFW/blogpost-fineweb-v1), a full data-engineering masterclass).
- Deduplication: "Deduplicating Training Data Makes LMs Better", MinHash / LSH, exact vs fuzzy.
- Quality filtering: classifier-based, perplexity filtering, DSIR, DoReMi ([arxiv 2305.10429](https://arxiv.org/abs/2305.10429)).
- Synthetic data: "Rephrasing the Web (WRAP)" ([arxiv 2401.16380](https://arxiv.org/abs/2401.16380)), the Phi textbooks line, Cosmopedia.
- Decontamination against eval sets (n-gram overlap).

**Tit-bits:** data mixture weights are a top-tier lever; annealing on high-quality data at the end of pretraining (the mid-training / cooldown phase, huge in 2024-2026, most tutorials miss it); upsampling code improves reasoning even for non-code tasks.

**Lexicon:** corpus, dedup (MinHash/LSH), quality classifier, perplexity filter, DSIR, DoReMi, data mixture, domain weights, upsampling, decontamination, n-gram overlap, synthetic data, annealing/cooldown/mid-training, curriculum learning, replay, catastrophic forgetting, token budget.

---

## Module 6: Distributed Training and Systems

To train at scale you must understand parallelism and the memory wall.

**Read:**
- Megatron-LM (Shoeybi et al. 2019): [arxiv 1909.08053](https://arxiv.org/abs/1909.08053), tensor parallelism.
- ZeRO / DeepSpeed: [arxiv 1910.02054](https://arxiv.org/abs/1910.02054). FSDP is the PyTorch-native equivalent.
- GPipe / PipeDream: pipeline parallelism, bubbles, 1F1B scheduling.
- Ring Attention: [arxiv 2310.01889](https://arxiv.org/abs/2310.01889) for long context.
- The Ultra-Scale Playbook (HuggingFace 2025) and "How to Scale Your Model" (JAX/Google).
- Activation checkpointing, CPU/NVMe offload, overlap of compute and communication, NCCL collectives.
- Hardware fluency: HBM bandwidth, arithmetic intensity, the roofline model, MFU (aim for 40-55%).

**Lexicon:** DP/TP/PP/EP/SP/CP, 3D/4D parallelism, ZeRO-1/2/3, FSDP, sharding, all-reduce/all-gather, NCCL, pipeline bubble, 1F1B, micro-batch, activation checkpointing, offloading, MFU/HFU, arithmetic intensity, roofline, NVLink/InfiniBand.

---

## Module 7: Mixture-of-Experts (near-mandatory in 2026)

Every frontier model (DeepSeek-V3, Mixtral, Qwen3, Llama 4, GPT-oss) is MoE now.

**Read:**
- Switch Transformer (Fedus et al. 2021): [arxiv 2101.03961](https://arxiv.org/abs/2101.03961) and GShard.
- Mixtral of Experts (2024): [arxiv 2401.04088](https://arxiv.org/abs/2401.04088).
- DeepSeek-V3 ([arxiv 2412.19437](https://arxiv.org/abs/2412.19437)): fine-grained plus shared experts, aux-loss-free load balancing, MLA, FP8. The most important single report of the era. Read it twice.

**Tit-bits:** top-k routing, load-balancing loss vs aux-loss-free balancing, expert collapse, router z-loss, capacity factor and token dropping, active vs total params (a 671B MoE runs like an about 37B dense model), upcycling dense to MoE.

**Lexicon:** sparse MoE, router/gating, top-k, active params, shared/fine-grained experts, load balancing, capacity factor, token dropping, expert parallel, upcycling, dense-vs-sparse.

---

## Module 8: Post-Training I: SFT and Instruction Tuning

Base model to helpful assistant.

**Read:**
- InstructGPT (Ouyang et al. 2022): [arxiv 2203.02155](https://arxiv.org/abs/2203.02155), the SFT to RM to PPO recipe that made ChatGPT. Required reading.
- FLAN, Self-Instruct ([arxiv 2212.10560](https://arxiv.org/abs/2212.10560)), Alpaca, Tulu 3 (AllenAI, the best open documented recipe: [arxiv 2411.15124](https://arxiv.org/abs/2411.15124)).
- Chat templates, loss masking on prompt tokens, packing vs padding, multi-turn masking.
- LoRA ([arxiv 2106.09685](https://arxiv.org/abs/2106.09685)) and QLoRA ([arxiv 2305.14314](https://arxiv.org/abs/2305.14314)), parameter-efficient finetuning.

**Tit-bits:** quality beats quantity for SFT (LIMA, 1K great examples); prompt-token loss masking is a silent bug source; chat template mismatch between train and inference is the number one finetuning failure.

**Lexicon:** SFT, instruction tuning, chat template, system prompt, loss masking, completion-only loss, packing, LoRA/QLoRA/DoRA, PEFT, adapters, catastrophic forgetting, alignment tax.

---

## Module 9: Post-Training II: RLHF, DPO and RLVR

The 2022 to 2026 arc: PPO to DPO to verifiable-reward RL (the reasoning-model era).

**Read:**
- PPO (Schulman et al.): [arxiv 1707.06347](https://arxiv.org/abs/1707.06347). Reward model, KL penalty to reference, value head, GAE, reward hacking.
- DPO (Rafailov et al. 2023): [arxiv 2305.18290](https://arxiv.org/abs/2305.18290), RLHF without a separate RL loop. Then IPO, KTO, ORPO, SimPO.
- RLAIF / Constitutional AI (Anthropic): [arxiv 2212.08073](https://arxiv.org/abs/2212.08073).
- DeepSeek-R1 ([arxiv 2501.12948](https://arxiv.org/abs/2501.12948)): GRPO, RLVR, R1-Zero (pure RL, no SFT, emergent CoT). This changed the field.
- Follow-ons: PPO vs GRPO vs RLOO, PRM vs ORM, rejection sampling / STaR / best-of-N, verifier design, entropy collapse.

**Tit-bits:** the KL-to-reference coefficient is the master knob; reward over-optimization; GRPO drops the value network and normalizes advantage within a sampled group; RLVR only works where you can *check* the answer (math, code, formal).

**Lexicon:** RLHF, reward model, Bradley-Terry, PPO, GAE, KL penalty, reference policy, DPO/IPO/KTO/ORPO/SimPO, RLAIF, GRPO, RLVR, verifier, PRM/ORM, rejection sampling, STaR, best-of-N, reward hacking, over-optimization, entropy collapse, rollout, advantage.

---

## Module 10: Long Context, Inference and Serving

Training is not done until it serves cheaply.

**Read:**
- Context extension: RoPE scaling, YaRN, Position Interpolation, ring attention; needle-in-a-haystack and RULER.
- Quantization: GPTQ, AWQ, SmoothQuant, NF4, GGUF/llama.cpp, FP8/INT4; QAT vs PTQ.
- Inference systems: vLLM plus PagedAttention, continuous batching, speculative decoding (draft model / Medusa / EAGLE), prefix caching, chunked prefill, TTFT vs TPOT/ITL.
- Distillation: knowledge distillation (Hinton), sequence-level KD, on-policy distillation.

**Lexicon:** KV cache, prefill vs decode, TTFT/TPOT/ITL, continuous batching, PagedAttention, speculative decoding, draft model, Medusa/EAGLE, GPTQ/AWQ/GGUF/NF4, PTQ/QAT, throughput vs latency, prefix caching, needle-in-a-haystack, RULER, distillation.

---

## Module 11: Evaluation (where credibility is won or lost)

**Read:**
- HELM (Stanford), lm-evaluation-harness (the de facto tool), MMLU / MMLU-Pro / GPQA / BBH / GSM8K / MATH / HumanEval+ / MBPP / IFEval / MT-Bench.
- LMSYS Chatbot Arena plus Elo / Bradley-Terry ranking, and its style/length confounds.
- LLM-as-a-judge (Zheng et al.), and its biases (position, verbosity, self-preference).

**Tit-bits normal people miss:** prompt-format sensitivity can swing MMLU by 5-10 points; contamination inflates everything; benchmark saturation; elicitation gap.

**Lexicon:** zero/few-shot, in-context learning, CoT prompting, self-consistency, pass@k, log-likelihood vs generative eval, contamination, saturation, Elo, LLM-as-judge, IFEval, held-out.

---

## Module 12: Interpretability, Safety and the Frontier Lexicon

Round out your vocabulary so you can read *any* 2026 paper.

- Mechanistic interpretability: residual stream, induction heads, superposition, sparse autoencoders (SAEs), features vs neurons (Anthropic's "Toward Monosemanticity," "Scaling Monosemanticity").
- Safety/alignment: jailbreaks, red-teaming, sycophancy, deceptive alignment, sandbagging, reward hacking, refusal training, unlearning.
- Emerging architectures: Mamba / SSMs, linear attention, hybrid models (Jamba, Zamba), Byte Latent Transformer (BLT), diffusion LMs, test-time compute, latent reasoning.

---

## The How-Do-I-Actually-Do-It Track

1. nanochat end-to-end (Module 0).
2. Sebastian Raschka, "Build a Large Language Model (From Scratch)" (book plus [repo](https://github.com/rasbt/LLMs-from-scratch)). Pair with his [Ahead of AI](https://magazine.sebastianraschka.com/) newsletter.
3. HuggingFace [LLM Course](https://huggingface.co/learn/llm-course) plus [Ultra-Scale Playbook](https://huggingface.co/spaces/nanotron/ultrascale-playbook).
4. Read one full technical report cover-to-cover: DeepSeek-V3, Llama 3 ([arxiv 2407.21783](https://arxiv.org/abs/2407.21783)), OLMo 2 / Tulu 3, Qwen3 ([arxiv 2505.09388](https://arxiv.org/abs/2505.09388)). These reports *are* the modern curriculum.

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
// render markdown
const md=document.getElementById("md").textContent;
if(window.marked){document.getElementById("content").innerHTML=marked.parse(md);}
else{
  // fallback if CDN blocked: show raw text readably
  const pre=document.createElement("pre");
  pre.style.whiteSpace="pre-wrap";pre.style.fontFamily="var(--mono)";pre.style.fontSize="13px";
  pre.textContent=md;document.getElementById("content").appendChild(pre);
}

// theme toggle
document.getElementById("themeBtn").addEventListener("click",()=>{
  const isLight=document.documentElement.getAttribute("data-theme")==="light";
  if(isLight){document.documentElement.removeAttribute("data-theme");localStorage.setItem("llm-theme","dark");}
  else{document.documentElement.setAttribute("data-theme","light");localStorage.setItem("llm-theme","light");}
});

// back to top
const bt=document.getElementById("backtop");
addEventListener("scroll",()=>{bt.classList.toggle("show",scrollY>600)});
</script>
</body>
</html>
